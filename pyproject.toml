[tool.poetry]
name = "quantumblur"
version = "0.1.0"
description = "Quantum image processing using Qiskit"
packages = [{include = "quantumblur"}]

[tool.poetry.dependencies]
python = "^3.10"
qiskit = ">=1.0"
qiskit-aer = ">=0.13"
numpy = "*"
scipy = "*"
Pillow = "*"

[tool.poetry.group.dev.dependencies]
pytest = "*"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
